name: coursewave

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - coursewave

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "coursewave_db"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-user123}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coursewave_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - coursewave

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-coursewave}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASSWORD:-coursewave}"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - coursewave

  coursewave:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LOG_LEVEL: "INFO"
      APP_HOST: "${APP_HOST:-localhost:3000}"
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-user123}@postgres:5432/coursewave_db"
      AUTO_CREATE_TABLES: "true"

      JWT_SECRET: "${JWT_SECRET:-dev-jwt-secret}"
      COOKIE_SECRET: "${COOKIE_SECRET:-dev-cookie-secret}"
      ACCESS_TOKEN_EXPIRY: "7m"
      REFRESH_TOKEN_EXPIRY: "7d"
      REFRESH_TOKEN_MAX_AGE_SECONDS: "604800"
      AUTH_EXCLUDE_PATHS: "/health,/auth/api/v1/token-refresh,/student/api/v1/login,/student/api/v1/register,/student/api/v1/email,/student/api/v1/password-reset,/student/api/v1/verify-email"

      CORS_ORIGIN: "*"
      CORS_METHODS: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      CORS_HEADERS: "Content-Type,Authorization,X-Request-ID"
      CORS_CREDENTIALS: "false"

      CACHE_ENABLED: "true"
      CACHE_TTL_SECONDS: "420"
      CACHE_EXCLUDE_PATHS: "/health"

      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_MAX: "100"
      RATE_LIMIT_EXCLUDE_PATHS: "/health"
      RATELIMIT_ROUTES: '[{"prefix":"/student/api","window_ms":90000,"strategy":"fixed_window"},{"prefix":"*","window_ms":90000,"strategy":"fixed_window"}]'

      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"

      RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER:-coursewave}:${RABBITMQ_DEFAULT_PASSWORD:-coursewave}@rabbitmq:5672/"
    ports:
      - "3000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - coursewave

volumes:
  redis_data:
  postgres_data:
  rabbitmq_data:

networks:
  coursewave:
    driver: bridge
